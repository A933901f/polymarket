name: Polymarket + Grok 100k-Unit Paper Trading Bot

on:
  schedule:
    # Runs every 30 minutes to scan markets, execute virtual bets, and settle positions
    - cron: '*/30 * * * *'
    # Explicit 4-hour mark triggers (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (single-scan, paper-report, backtest-audit)'
        required: true
        default: 'single-scan'
      force_paper_report:
        description: 'Force sending the 4-hour 100k-unit report right now?'
        required: false
        default: 'false'
      min_roi:
        description: 'Optional minimum ROI override (e.g. 1.0 for +100% ROI)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: polymarket-paper-bot-state
  cancel-in-progress: false

jobs:
  scan-and-paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (with persistent SQLite ledger)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Polymarket + Grok Scanner & 100k-Unit Paper Trader
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PAPER_INITIAL_UNITS: '100000.0'
          PAPER_REPORT_HOURS: '4.0'
          BANKROLL_USD: '100000.0'
          GROK_MAX_MARKETS_PER_CYCLE: '10'
          DRY_RUN: 'false'
        run: |
          mkdir -p data logs
          MODE="${{ github.event.inputs.mode || 'single-scan' }}"
          EXTRA_ARGS="--live --max-pages 5"

          if [ "${{ github.event.inputs.force_paper_report }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --send-paper-report"
          fi

          if [ -n "${{ github.event.inputs.min_roi }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --min-roi ${{ github.event.inputs.min_roi }}"
          fi

          python main_orchestrator.py --mode "$MODE" $EXTRA_ARGS

      - name: Checkpoint SQLite WAL into main database file before commit
        if: always()
        run: |
          if [ -f data/pm_engine.sqlite3 ]; then
            python -c "import sqlite3; conn = sqlite3.connect('data/pm_engine.sqlite3'); conn.execute('PRAGMA wal_checkpoint(TRUNCATE);'); conn.close()"
            rm -f data/pm_engine.sqlite3-wal data/pm_engine.sqlite3-shm
          fi

      - name: Commit & Push updated 100k-unit ledger back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/pm_engine.sqlite3 ]; then
            git add data/pm_engine.sqlite3
            git diff --staged --quiet || git commit -m "chore(ledger): update 100k-unit paper trading state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
